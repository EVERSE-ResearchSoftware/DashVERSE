- name: "PI01: Projects Overview"
  uri:
    url: "{{ superset_api }}/chart/"
    method: POST
    headers:
      Cookie: "{{ session_cookie }}"
      X-CSRFToken: "{{ csrf_token }}"
      Content-Type: application/json
    body_format: json
    body:
      slice_name: "Projects Overview"
      description: "Count of unique software projects you have submitted assessments for. Acts as the denominator for the rest of this dashboard."
      datasource_id: "{{ dataset_ids['assessments_detailed'] }}"
      datasource_type: "table"
      viz_type: "big_number_total"
      params: |
        {
          "metric": {"label": "count", "expressionType": "SQL", "sqlExpression": "COUNT(DISTINCT software_name)"},
          "header_font_size": 0.4,
          "subheader_font_size": 0.15,
          "subheader": "Unique Projects Assessed"
        }
    status_code: [200, 201]
  when: existing_charts.json.result | selectattr('slice_name', 'equalto', 'Projects Overview') | list | length == 0

- name: "PI02: Quality Across Projects"
  uri:
    url: "{{ superset_api }}/chart/"
    method: POST
    headers:
      Cookie: "{{ session_cookie }}"
      X-CSRFToken: "{{ csrf_token }}"
      Content-Type: application/json
    body_format: json
    body:
      slice_name: "Quality Across Projects"
      description: "Average quality score per project across all dimensions. Compare projects side-by-side to spot which need the most attention."
      datasource_id: "{{ dataset_ids['software_quality_scores'] }}"
      datasource_type: "table"
      viz_type: "dist_bar"
      params: |
        {
          "groupby": ["software_name"],
          "metrics": [{"label": "score", "expressionType": "SIMPLE", "column": {"column_name": "score"}, "aggregate": "AVG"}],
          "color_scheme": "supersetColors",
          "row_limit": 20,
          "show_bar_value": true,
          "y_axis_format": ".1f"
        }
    status_code: [200, 201]
  when: existing_charts.json.result | selectattr('slice_name', 'equalto', 'Quality Across Projects') | list | length == 0

- name: "PI03: Assessment Timeline"
  uri:
    url: "{{ superset_api }}/chart/"
    method: POST
    headers:
      Cookie: "{{ session_cookie }}"
      X-CSRFToken: "{{ csrf_token }}"
      Content-Type: application/json
    body_format: json
    body:
      slice_name: "Assessment Timeline"
      description: "Number of assessments per month across your projects. Gaps may indicate paused work; spikes typically correspond to release-time review pushes."
      datasource_id: "{{ dataset_ids['assessment_trends'] }}"
      datasource_type: "table"
      viz_type: "echarts_timeseries_line"
      params: |
        {
          "x_axis": "month",
          "metrics": [{"label": "assessments", "expressionType": "SIMPLE", "column": {"column_name": "assessments"}, "aggregate": "SUM"}],
          "color_scheme": "supersetColors",
          "show_legend": true,
          "rich_tooltip": true
        }
    status_code: [200, 201]
  when: existing_charts.json.result | selectattr('slice_name', 'equalto', 'Assessment Timeline') | list | length == 0

- name: "PI04: Dimensions by Project"
  uri:
    url: "{{ superset_api }}/chart/"
    method: POST
    headers:
      Cookie: "{{ session_cookie }}"
      X-CSRFToken: "{{ csrf_token }}"
      Content-Type: application/json
    body_format: json
    body:
      slice_name: "Dimensions by Project"
      description: "Sunburst showing per-project distribution of checks across dimensions. Click a project segment to drill into how its quality is split across dimensions."
      datasource_id: "{{ dataset_ids['checks_detailed'] }}"
      datasource_type: "table"
      viz_type: "sunburst_v2"
      params: |
        {
          "columns": ["software_name", "dimension_name"],
          "metric": {"label": "count", "expressionType": "SQL", "sqlExpression": "COUNT(*)"},
          "color_scheme": "supersetColors"
        }
    status_code: [200, 201]
  when: existing_charts.json.result | selectattr('slice_name', 'equalto', 'Dimensions by Project') | list | length == 0

- name: "PI05: Failed Checks Requiring Action"
  uri:
    url: "{{ superset_api }}/chart/"
    method: POST
    headers:
      Cookie: "{{ session_cookie }}"
      X-CSRFToken: "{{ csrf_token }}"
      Content-Type: application/json
    body_format: json
    body:
      slice_name: "Failed Checks Requiring Action"
      description: "Detailed list of every failing check with software, dimension, indicator, and output. Sort by software or dimension to triage what needs fixing first."
      datasource_id: "{{ dataset_ids['checks_detailed'] }}"
      datasource_type: "table"
      viz_type: "table"
      params: |
        {
          "all_columns": ["software_name", "dimension_name", "indicator_name", "status", "output"],
          "row_limit": 50,
          "table_filter": true
        }
    status_code: [200, 201]
  when: existing_charts.json.result | selectattr('slice_name', 'equalto', 'Failed Checks Requiring Action') | list | length == 0

- name: "PI06: Project Health Gauge"
  uri:
    url: "{{ superset_api }}/chart/"
    method: POST
    headers:
      Cookie: "{{ session_cookie }}"
      X-CSRFToken: "{{ csrf_token }}"
      Content-Type: application/json
    body_format: json
    body:
      slice_name: "Project Health Gauge"
      description: "Average pass rate across your portfolio shown as a gauge. Use as an at-a-glance health indicator at PI status meetings."
      datasource_id: "{{ dataset_ids['dimension_coverage'] }}"
      datasource_type: "table"
      viz_type: "gauge_chart"
      params: |
        {
          "metric": {"label": "pass_rate", "expressionType": "SIMPLE", "column": {"column_name": "pass_rate"}, "aggregate": "AVG"},
          "min_val": 0,
          "max_val": 100,
          "color_scheme": "supersetColors"
        }
    status_code: [200, 201]
  when: existing_charts.json.result | selectattr('slice_name', 'equalto', 'Project Health Gauge') | list | length == 0

- name: "PI07: Check Status Distribution"
  uri:
    url: "{{ superset_api }}/chart/"
    method: POST
    headers:
      Cookie: "{{ session_cookie }}"
      X-CSRFToken: "{{ csrf_token }}"
      Content-Type: application/json
    body_format: json
    body:
      slice_name: "Check Status Distribution"
      description: "Donut showing the proportion of pass/fail/other check outcomes across all your assessments. A large fail slice signals a portfolio-wide quality gap."
      datasource_id: "{{ dataset_ids['indicator_results'] }}"
      datasource_type: "table"
      viz_type: "pie"
      params: |
        {
          "groupby": ["status"],
          "metric": {"label": "occurrences", "expressionType": "SIMPLE", "column": {"column_name": "occurrences"}, "aggregate": "SUM"},
          "color_scheme": "supersetColors",
          "show_labels": true,
          "show_legend": true,
          "donut": true,
          "innerRadius": 40
        }
    status_code: [200, 201]
  when: existing_charts.json.result | selectattr('slice_name', 'equalto', 'Check Status Distribution') | list | length == 0

- name: "PI08: Recent Assessments"
  uri:
    url: "{{ superset_api }}/chart/"
    method: POST
    headers:
      Cookie: "{{ session_cookie }}"
      X-CSRFToken: "{{ csrf_token }}"
      Content-Type: application/json
    body_format: json
    body:
      slice_name: "Recent Assessments"
      description: "Most recently submitted assessments, ordered by date. Use to confirm assessments arrived on schedule for the projects you expect."
      datasource_id: "{{ dataset_ids['assessments_detailed'] }}"
      datasource_type: "table"
      viz_type: "table"
      params: |
        {
          "all_columns": ["software_name", "date_created", "total_checks"],
          "order_by_cols": [["date_created", false]],
          "row_limit": 20
        }
    status_code: [200, 201]
  when: existing_charts.json.result | selectattr('slice_name', 'equalto', 'Recent Assessments') | list | length == 0

- name: "PI09: Quality Improvement Tracking"
  uri:
    url: "{{ superset_api }}/chart/"
    method: POST
    headers:
      Cookie: "{{ session_cookie }}"
      X-CSRFToken: "{{ csrf_token }}"
      Content-Type: application/json
    body_format: json
    body:
      slice_name: "Quality Improvement Tracking"
      description: "Trend of assessment volume over time. A rising line means quality engagement is growing; a flat line suggests improvement work has stalled."
      datasource_id: "{{ dataset_ids['assessment_trends'] }}"
      datasource_type: "table"
      viz_type: "echarts_timeseries_line"
      params: |
        {
          "x_axis": "month",
          "metrics": [{"label": "assessments", "expressionType": "SIMPLE", "column": {"column_name": "assessments"}, "aggregate": "SUM"}],
          "color_scheme": "supersetColors",
          "show_legend": true
        }
    status_code: [200, 201]
  when: existing_charts.json.result | selectattr('slice_name', 'equalto', 'Quality Improvement Tracking') | list | length == 0

- name: "PI10: Check Distribution Treemap"
  uri:
    url: "{{ superset_api }}/chart/"
    method: POST
    headers:
      Cookie: "{{ session_cookie }}"
      X-CSRFToken: "{{ csrf_token }}"
      Content-Type: application/json
    body_format: json
    body:
      slice_name: "Check Distribution Treemap"
      description: "Tile area shows how many checks each dimension-indicator combination has accumulated. Dominant tiles flag indicators that drive most of the testing effort."
      datasource_id: "{{ dataset_ids['checks_detailed'] }}"
      datasource_type: "table"
      viz_type: "treemap_v2"
      params: |
        {
          "groupby": ["dimension_name", "indicator_name"],
          "metrics": [{"label": "count", "expressionType": "SQL", "sqlExpression": "COUNT(*)"}],
          "color_scheme": "supersetColors"
        }
    status_code: [200, 201]
  when: existing_charts.json.result | selectattr('slice_name', 'equalto', 'Check Distribution Treemap') | list | length == 0
