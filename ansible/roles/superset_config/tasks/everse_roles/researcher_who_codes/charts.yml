  when: existing_charts.json.result | selectattr('slice_name', 'equalto', 'Top Performing Projects') | list | length == 0

- name: "RWC09: Easy Improvements"
  uri:
    url: "{{ superset_api }}/chart/"
    method: POST
    headers:
      Cookie: "{{ session_cookie }}"
      X-CSRFToken: "{{ csrf_token }}"
      Content-Type: application/json
    body_format: json
    body:
      slice_name: "Easy Improvements"
      description: "Detailed list of check evidence text. Scan the evidence column for one-line fixes (e.g. 'add a CITATION.cff') you can act on quickly."
      datasource_id: "{{ dataset_ids['checks_detailed'] }}"
      datasource_type: "table"
      viz_type: "table"
      params: |
        {
          "all_columns": ["indicator_name", "dimension_name", "evidence"],
          "row_limit": 15,
          "table_filter": true
        }
    status_code: [200, 201]
  when: existing_charts.json.result | selectattr('slice_name', 'equalto', 'Easy Improvements') | list | length == 0

- name: "RWC10: Checks by Status"
  uri:
    url: "{{ superset_api }}/chart/"
    method: POST
    headers:
      Cookie: "{{ session_cookie }}"
      X-CSRFToken: "{{ csrf_token }}"
      Content-Type: application/json
    body_format: json
    body:
      slice_name: "Checks by Status"
      description: "Share of checks that passed, failed, or were not applicable. A large fail slice signals systematic issues; a small fail slice means the project is healthy."
      datasource_id: "{{ dataset_ids['indicator_results'] }}"
      datasource_type: "table"
      viz_type: "pie"
      params: |
        {
          "groupby": ["status"],
          "metric": {"label": "occurrences", "expressionType": "SIMPLE", "column": {"column_name": "occurrences"}, "aggregate": "SUM"},
          "color_scheme": "supersetColors",
          "show_labels": true,
          "show_legend": true
        }
    status_code: [200, 201]
  when: existing_charts.json.result | selectattr('slice_name', 'equalto', 'Checks by Status') | list | length == 0
