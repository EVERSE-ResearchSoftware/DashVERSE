- name: "RWC01: My Quality Score"
  uri:
    url: "{{ superset_api }}/chart/"
    method: POST
    headers:
      Cookie: "{{ session_cookie }}"
      X-CSRFToken: "{{ csrf_token }}"
      Content-Type: application/json
    body_format: json
    body:
      slice_name: "My Quality Score"
      description: "Average percentage of checks that passed across all dimensions for the assessed software. Aim above 75% for a healthy project; below 50% indicates significant gaps to address."
      datasource_id: "{{ dataset_ids['dimension_coverage'] }}"
      datasource_type: "table"
      viz_type: "big_number_total"
      params: |
        {
          "metric": {"label": "pass_rate", "expressionType": "SIMPLE", "column": {"column_name": "pass_rate"}, "aggregate": "AVG"},
          "header_font_size": 0.4,
          "subheader_font_size": 0.15,
          "subheader": "Average Quality Score"
        }
    status_code: [200, 201]
  when: existing_charts.json.result | selectattr('slice_name', 'equalto', 'My Quality Score') | list | length == 0

- name: "RWC02: Check Pass Rate Gauge"
  uri:
    url: "{{ superset_api }}/chart/"
    method: POST
    headers:
      Cookie: "{{ session_cookie }}"
      X-CSRFToken: "{{ csrf_token }}"
      Content-Type: application/json
    body_format: json
    body:
      slice_name: "Check Pass Rate Gauge"
      description: "The same overall pass rate displayed as a gauge for at-a-glance reading. Use during stand-ups or progress reports to show project health quickly."
      datasource_id: "{{ dataset_ids['dimension_coverage'] }}"
      datasource_type: "table"
      viz_type: "gauge_chart"
      params: |
        {
          "metric": {"label": "pass_rate", "expressionType": "SIMPLE", "column": {"column_name": "pass_rate"}, "aggregate": "AVG"},
          "min_val": 0,
          "max_val": 100,
          "color_scheme": "supersetColors"
        }
    status_code: [200, 201]
  when: existing_charts.json.result | selectattr('slice_name', 'equalto', 'Check Pass Rate Gauge') | list | length == 0

- name: "RWC03: Quality Over Time"
  uri:
    url: "{{ superset_api }}/chart/"
    method: POST
    headers:
      Cookie: "{{ session_cookie }}"
      X-CSRFToken: "{{ csrf_token }}"
      Content-Type: application/json
    body_format: json
    body:
      slice_name: "Quality Over Time"
      description: "Number of assessments performed per month. Spikes signal active improvement work; a flat line suggests room to schedule re-assessments."
      datasource_id: "{{ dataset_ids['assessment_trends'] }}"
      datasource_type: "table"
      viz_type: "echarts_timeseries_line"
      params: |
        {
          "x_axis": "month",
          "metrics": [{"label": "assessments", "expressionType": "SIMPLE", "column": {"column_name": "assessments"}, "aggregate": "SUM"}],
          "color_scheme": "supersetColors",
          "show_legend": false
        }
    status_code: [200, 201]
  when: existing_charts.json.result | selectattr('slice_name', 'equalto', 'Quality Over Time') | list | length == 0

- name: "RWC04: My Quality Profile"
  uri:
    url: "{{ superset_api }}/chart/"
    method: POST
    headers:
      Cookie: "{{ session_cookie }}"
      X-CSRFToken: "{{ csrf_token }}"
      Content-Type: application/json
    body_format: json
    body:
      slice_name: "My Quality Profile"
      description: "Distribution of passed checks across quality dimensions. Large slices identify your strengths; small slices show neglected dimensions worth investing in."
      datasource_id: "{{ dataset_ids['dimension_coverage'] }}"
      datasource_type: "table"
      viz_type: "pie"
      params: |
        {
          "groupby": ["dimension_name"],
          "metric": {"label": "passed", "expressionType": "SIMPLE", "column": {"column_name": "passed"}, "aggregate": "SUM"},
          "color_scheme": "supersetColors",
          "show_labels": true,
          "show_legend": true
        }
    status_code: [200, 201]
  when: existing_charts.json.result | selectattr('slice_name', 'equalto', 'My Quality Profile') | list | length == 0

- name: "RWC05: Action Items"
  uri:
    url: "{{ superset_api }}/chart/"
    method: POST
    headers:
      Cookie: "{{ session_cookie }}"
      X-CSRFToken: "{{ csrf_token }}"
      Content-Type: application/json
    body_format: json
    body:
      slice_name: "Action Items"
      description: "Detailed list of every check with its dimension, indicator, status, output, and evidence. Filter by status to focus on failed checks needing attention first."
      datasource_id: "{{ dataset_ids['checks_detailed'] }}"
      datasource_type: "table"
      viz_type: "table"
      params: |
        {
          "all_columns": ["dimension_name", "indicator_name", "status", "output", "evidence"],
          "row_limit": 20,
          "table_filter": true
        }
    status_code: [200, 201]
  when: existing_charts.json.result | selectattr('slice_name', 'equalto', 'Action Items') | list | length == 0

- name: "RWC06: Indicator Results"
  uri:
    url: "{{ superset_api }}/chart/"
    method: POST
    headers:
      Cookie: "{{ session_cookie }}"
      X-CSRFToken: "{{ csrf_token }}"
      Content-Type: application/json
    body_format: json
    body:
      slice_name: "Indicator Results"
      description: "Per-indicator count and percentage of each status outcome. Helps you spot which specific checks are most often failing for your software."
      datasource_id: "{{ dataset_ids['indicator_results'] }}"
      datasource_type: "table"
      viz_type: "table"
      params: |
        {
          "all_columns": ["indicator_name", "status", "occurrences"],
          "order_by_cols": [["occurrences", false]],
          "row_limit": 50
        }
    status_code: [200, 201]
  when: existing_charts.json.result | selectattr('slice_name', 'equalto', 'Indicator Results') | list | length == 0

- name: "RWC07: Focus Areas"
  uri:
    url: "{{ superset_api }}/chart/"
    method: POST
    headers:
      Cookie: "{{ session_cookie }}"
      X-CSRFToken: "{{ csrf_token }}"
      Content-Type: application/json
    body_format: json
    body:
      slice_name: "Focus Areas"
      description: "Top 10 indicators with the most failures across the portfolio. Tackle these first for the biggest quality gains."
      datasource_id: "{{ dataset_ids['common_issues'] }}"
      datasource_type: "table"
      viz_type: "dist_bar"
      params: |
        {
          "groupby": ["indicator_name"],
          "metrics": [{"label": "failure_count", "expressionType": "SIMPLE", "column": {"column_name": "failure_count"}, "aggregate": "SUM"}],
          "color_scheme": "supersetColors",
          "row_limit": 10,
          "show_bar_value": true
        }
    status_code: [200, 201]
  when: existing_charts.json.result | selectattr('slice_name', 'equalto', 'Focus Areas') | list | length == 0

- name: "RWC08: Top Performing Projects"
  uri:
    url: "{{ superset_api }}/chart/"
    method: POST
    headers:
      Cookie: "{{ session_cookie }}"
      X-CSRFToken: "{{ csrf_token }}"
      Content-Type: application/json
