- name: "TR01: Active Assessments"
  uri:
    url: "{{ superset_api }}/chart/"
    method: POST
    headers:
      Cookie: "{{ session_cookie }}"
      X-CSRFToken: "{{ csrf_token }}"
      Content-Type: application/json
    body_format: json
    body:
      slice_name: "Active Assessments"
      description: "Count of all assessments submitted across the dataset. The volume metric to anchor training-impact discussions."
      datasource_id: "{{ dataset_ids['assessments_detailed'] }}"
      datasource_type: "table"
      viz_type: "big_number_total"
      params: |
        {
          "metric": {"label": "count", "expressionType": "SQL", "sqlExpression": "COUNT(*)"},
          "header_font_size": 0.4,
          "subheader_font_size": 0.15,
          "subheader": "Total Assessments"
        }
    status_code: [200, 201]
  when: existing_charts.json.result | selectattr('slice_name', 'equalto', 'Active Assessments') | list | length == 0

- name: "TR02: Average Quality Score"
  uri:
    url: "{{ superset_api }}/chart/"
    method: POST
    headers:
      Cookie: "{{ session_cookie }}"
      X-CSRFToken: "{{ csrf_token }}"
      Content-Type: application/json
    body_format: json
    body:
      slice_name: "Average Quality Score"
      description: "Average pass rate across all software and dimensions in the dataset. Track this as the headline outcome metric of training effectiveness."
      datasource_id: "{{ dataset_ids['dimension_coverage'] }}"
      datasource_type: "table"
      viz_type: "big_number_total"
      params: |
        {
          "metric": {"label": "pass_rate", "expressionType": "SIMPLE", "column": {"column_name": "pass_rate"}, "aggregate": "AVG"},
          "header_font_size": 0.4,
          "subheader_font_size": 0.15,
          "subheader": "Average Pass Rate"
        }
    status_code: [200, 201]
  when: existing_charts.json.result | selectattr('slice_name', 'equalto', 'Average Quality Score') | list | length == 0

- name: "TR03: Quality Improvement Timeline"
  uri:
    url: "{{ superset_api }}/chart/"
    method: POST
    headers:
      Cookie: "{{ session_cookie }}"
      X-CSRFToken: "{{ csrf_token }}"
      Content-Type: application/json
    body_format: json
    body:
      slice_name: "Quality Improvement Timeline"
      description: "Assessment volume over time. Rising lines may correlate with the impact of training cohorts; investigate spikes to validate the connection."
      datasource_id: "{{ dataset_ids['assessment_trends'] }}"
      datasource_type: "table"
      viz_type: "echarts_timeseries_line"
      params: |
        {
          "x_axis": "month",
          "metrics": [{"label": "assessments", "expressionType": "SIMPLE", "column": {"column_name": "assessments"}, "aggregate": "SUM"}],
          "color_scheme": "supersetColors",
          "show_legend": true
        }
    status_code: [200, 201]
  when: existing_charts.json.result | selectattr('slice_name', 'equalto', 'Quality Improvement Timeline') | list | length == 0

- name: "TR04: Common Failed Checks"
  uri:
    url: "{{ superset_api }}/chart/"
    method: POST
    headers:
      Cookie: "{{ session_cookie }}"
      X-CSRFToken: "{{ csrf_token }}"
      Content-Type: application/json
    body_format: json
    body:
      slice_name: "Common Failed Checks"
      description: "Top 15 indicators that fail most often across all assessed software. Use to prioritise training topics where they will have the most impact on quality."
      datasource_id: "{{ dataset_ids['common_issues'] }}"
      datasource_type: "table"
      viz_type: "dist_bar"
      params: |
        {
          "groupby": ["indicator_name"],
          "metrics": [{"label": "failure_count", "expressionType": "SIMPLE", "column": {"column_name": "failure_count"}, "aggregate": "SUM"}],
          "color_scheme": "supersetColors",
          "row_limit": 15,
          "show_bar_value": true
        }
    status_code: [200, 201]
  when: existing_charts.json.result | selectattr('slice_name', 'equalto', 'Common Failed Checks') | list | length == 0

- name: "TR05: Competency Heatmap"
  uri:
    url: "{{ superset_api }}/chart/"
    method: POST
    headers:
      Cookie: "{{ session_cookie }}"
      X-CSRFToken: "{{ csrf_token }}"
      Content-Type: application/json
    body_format: json
    body:
      slice_name: "Competency Heatmap"
      description: "Score per software-by-dimension. Cooler colours mark dimensions where many learners need help; use as a syllabus prioritisation tool."
      datasource_id: "{{ dataset_ids['software_quality_scores'] }}"
      datasource_type: "table"
      viz_type: "heatmap"
      params: |
        {
          "all_columns_x": "software_name",
          "all_columns_y": "dimension_name",
          "metric": {"label": "score", "expressionType": "SIMPLE", "column": {"column_name": "score"}, "aggregate": "AVG"},
          "linear_color_scheme": "greenOrange",
          "show_values": true
        }
    status_code: [200, 201]
  when: existing_charts.json.result | selectattr('slice_name', 'equalto', 'Competency Heatmap') | list | length == 0

- name: "TR06: Activity by Topic Treemap"
  uri:
    url: "{{ superset_api }}/chart/"
    method: POST
    headers:
      Cookie: "{{ session_cookie }}"
      X-CSRFToken: "{{ csrf_token }}"
      Content-Type: application/json
    body_format: json
    body:
      slice_name: "Activity by Topic Treemap"
      description: "Tile area shows how many checks each dimension-indicator combination has accumulated. Dominant tiles indicate where most learning activity is happening."
      datasource_id: "{{ dataset_ids['checks_detailed'] }}"
      datasource_type: "table"
      viz_type: "treemap_v2"
      params: |
        {
          "groupby": ["dimension_name", "indicator_name"],
          "metrics": [{"label": "count", "expressionType": "SQL", "sqlExpression": "COUNT(*)"}],
          "color_scheme": "supersetColors"
        }
    status_code: [200, 201]
  when: existing_charts.json.result | selectattr('slice_name', 'equalto', 'Activity by Topic Treemap') | list | length == 0

- name: "TR07: Software Categories Pie"
  uri:
    url: "{{ superset_api }}/chart/"
    method: POST
    headers:
      Cookie: "{{ session_cookie }}"
      X-CSRFToken: "{{ csrf_token }}"
      Content-Type: application/json
    body_format: json
    body:
      slice_name: "Software Categories Pie"
      description: "Donut of check counts grouped by quality dimension. Identifies topic balance across the assessed corpus and surfaces under-represented areas."
      datasource_id: "{{ dataset_ids['checks_detailed'] }}"
      datasource_type: "table"
      viz_type: "pie"
      params: |
        {
          "groupby": ["dimension_name"],
          "metric": {"label": "count", "expressionType": "SQL", "sqlExpression": "COUNT(*)"},
          "color_scheme": "supersetColors",
          "show_labels": true,
          "show_legend": true,
          "donut": true,
          "innerRadius": 40
        }
    status_code: [200, 201]
  when: existing_charts.json.result | selectattr('slice_name', 'equalto', 'Software Categories Pie') | list | length == 0

- name: "TR08: Training Effectiveness"
  uri:
    url: "{{ superset_api }}/chart/"
    method: POST
    headers:
      Cookie: "{{ session_cookie }}"
      X-CSRFToken: "{{ csrf_token }}"
      Content-Type: application/json
    body_format: json
    body:
      slice_name: "Training Effectiveness"
      description: "Trend of assessment volume over time, expected to rise after a training intervention. Investigate flat or falling lines as feedback for course design."
      datasource_id: "{{ dataset_ids['assessment_trends'] }}"
      datasource_type: "table"
      viz_type: "echarts_timeseries_line"
      params: |
        {
          "x_axis": "month",
          "metrics": [{"label": "assessments", "expressionType": "SIMPLE", "column": {"column_name": "assessments"}, "aggregate": "SUM"}],
          "color_scheme": "supersetColors",
          "show_legend": true,
          "y_axis_format": ".0f"
        }
    status_code: [200, 201]
  when: existing_charts.json.result | selectattr('slice_name', 'equalto', 'Training Effectiveness') | list | length == 0

- name: "TR09: Progress Tracking Table"
  uri:
    url: "{{ superset_api }}/chart/"
    method: POST
    headers:
      Cookie: "{{ session_cookie }}"
      X-CSRFToken: "{{ csrf_token }}"
      Content-Type: application/json
    body_format: json
    body:
      slice_name: "Progress Tracking Table"
      description: "Most recent assessments with software, date, and check counts. Use to confirm participants are actually running assessments after training."
      datasource_id: "{{ dataset_ids['assessments_detailed'] }}"
      datasource_type: "table"
      viz_type: "table"
      params: |
        {
          "all_columns": ["software_name", "date_created", "total_checks"],
          "order_by_cols": [["date_created", false]],
          "row_limit": 50
        }
    status_code: [200, 201]
  when: existing_charts.json.result | selectattr('slice_name', 'equalto', 'Progress Tracking Table') | list | length == 0

- name: "TR10: Knowledge Gaps Sunburst"
  uri:
    url: "{{ superset_api }}/chart/"
    method: POST
    headers:
      Cookie: "{{ session_cookie }}"
      X-CSRFToken: "{{ csrf_token }}"
      Content-Type: application/json
    body_format: json
    body:
      slice_name: "Knowledge Gaps Sunburst"
      description: "Hierarchical view of dimension to indicator to status. Large fail arcs surface specific topics where learners need more coaching."
      datasource_id: "{{ dataset_ids['checks_detailed'] }}"
      datasource_type: "table"
      viz_type: "sunburst_v2"
      params: |
        {
          "columns": ["dimension_name", "indicator_name", "status"],
          "metric": {"label": "count", "expressionType": "SQL", "sqlExpression": "COUNT(*)"},
          "color_scheme": "supersetColors"
        }
    status_code: [200, 201]
  when: existing_charts.json.result | selectattr('slice_name', 'equalto', 'Knowledge Gaps Sunburst') | list | length == 0

- name: "TR11: Topics Covered Bar"
  uri:
    url: "{{ superset_api }}/chart/"
    method: POST
    headers:
      Cookie: "{{ session_cookie }}"
      X-CSRFToken: "{{ csrf_token }}"
      Content-Type: application/json
    body_format: json
    body:
      slice_name: "Topics Covered Bar"
      description: "Number of checks performed per dimension. Wide bars show well-covered topics; short bars are the curriculum holes worth filling next."
      datasource_id: "{{ dataset_ids['checks_detailed'] }}"
      datasource_type: "table"
      viz_type: "dist_bar"
      params: |
        {
          "groupby": ["dimension_name"],
          "metrics": [{"label": "count", "expressionType": "SQL", "sqlExpression": "COUNT(*)"}],
          "color_scheme": "supersetColors",
          "row_limit": 15,
          "show_bar_value": true
        }
    status_code: [200, 201]
  when: existing_charts.json.result | selectattr('slice_name', 'equalto', 'Topics Covered Bar') | list | length == 0

- name: "TR12: High Achievers Table"
  uri:
    url: "{{ superset_api }}/chart/"
    method: POST
    headers:
      Cookie: "{{ session_cookie }}"
      X-CSRFToken: "{{ csrf_token }}"
      Content-Type: application/json
    body_format: json
    body:
      slice_name: "High Achievers Table"
      description: "Software with the highest quality scores across dimensions. Use as case-study material to demonstrate good practice in training sessions."
      datasource_id: "{{ dataset_ids['software_quality_scores'] }}"
      datasource_type: "table"
      viz_type: "table"
      params: |
        {
          "all_columns": ["software_name", "dimension_name", "score"],
          "order_by_cols": [["score", false]],
          "row_limit": 20
        }
    status_code: [200, 201]
  when: existing_charts.json.result | selectattr('slice_name', 'equalto', 'High Achievers Table') | list | length == 0
