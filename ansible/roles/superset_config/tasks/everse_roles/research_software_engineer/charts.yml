- name: "RSE01: Total Checks"
  uri:
    url: "{{ superset_api }}/chart/"
    method: POST
    headers:
      Cookie: "{{ session_cookie }}"
      X-CSRFToken: "{{ csrf_token }}"
      Content-Type: application/json
    body_format: json
    body:
      slice_name: "Total Checks"
      description: "Total number of individual quality checks executed across all assessments. Acts as the atomic-unit denominator when interpreting per-check ratios elsewhere."
      datasource_id: "{{ dataset_ids['checks_detailed'] }}"
      datasource_type: "table"
      viz_type: "big_number_total"
      params: |
        {
          "metric": {"label": "count", "expressionType": "SQL", "sqlExpression": "COUNT(*)"},
          "header_font_size": 0.4,
          "subheader_font_size": 0.15,
          "subheader": "Total Checks Performed"
        }
    status_code: [200, 201]
  when: existing_charts.json.result | selectattr('slice_name', 'equalto', 'Total Checks') | list | length == 0

- name: "RSE02: Pass Rate KPI"
  uri:
    url: "{{ superset_api }}/chart/"
    method: POST
    headers:
      Cookie: "{{ session_cookie }}"
      X-CSRFToken: "{{ csrf_token }}"
      Content-Type: application/json
    body_format: json
    body:
      slice_name: "Pass Rate KPI"
      description: "Overall percentage of checks that passed across all assessments. Aim for 80% or higher as a healthy target across the portfolio."
      datasource_id: "{{ dataset_ids['dimension_coverage'] }}"
      datasource_type: "table"
      viz_type: "big_number_total"
      params: |
        {
          "metric": {"label": "pass_rate", "expressionType": "SIMPLE", "column": {"column_name": "pass_rate"}, "aggregate": "AVG"},
          "header_font_size": 0.4,
          "subheader_font_size": 0.15,
          "subheader": "Average Pass Rate %"
        }
    status_code: [200, 201]
  when: existing_charts.json.result | selectattr('slice_name', 'equalto', 'Pass Rate KPI') | list | length == 0

- name: "RSE03: Technical Debt Heatmap"
  uri:
    url: "{{ superset_api }}/chart/"
    method: POST
    headers:
      Cookie: "{{ session_cookie }}"
      X-CSRFToken: "{{ csrf_token }}"
      Content-Type: application/json
    body_format: json
    body:
      slice_name: "Technical Debt Heatmap"
      description: "Score per software-by-dimension; greener cells are stronger, oranger cells weaker. Use to spot which project-dimension pairs need the most engineering effort."
      datasource_id: "{{ dataset_ids['software_quality_scores'] }}"
      datasource_type: "table"
      viz_type: "heatmap"
      params: |
        {
          "all_columns_x": "software_name",
          "all_columns_y": "dimension_name",
          "metric": {"label": "score", "expressionType": "SIMPLE", "column": {"column_name": "score"}, "aggregate": "AVG"},
          "linear_color_scheme": "greenOrange",
          "show_values": true
        }
    status_code: [200, 201]
  when: existing_charts.json.result | selectattr('slice_name', 'equalto', 'Technical Debt Heatmap') | list | length == 0

- name: "RSE04: Check Results Pie"
  uri:
    url: "{{ superset_api }}/chart/"
    method: POST
    headers:
      Cookie: "{{ session_cookie }}"
      X-CSRFToken: "{{ csrf_token }}"
      Content-Type: application/json
    body_format: json
    body:
      slice_name: "Check Results Pie"
      description: "Donut breakdown of check status outcomes. The fail slice sizes the technical-debt backlog at a glance."
      datasource_id: "{{ dataset_ids['checks_detailed'] }}"
      datasource_type: "table"
      viz_type: "pie"
      params: |
        {
          "groupby": ["status"],
          "metric": {"label": "count", "expressionType": "SQL", "sqlExpression": "COUNT(*)"},
          "color_scheme": "supersetColors",
          "show_labels": true,
          "show_legend": true,
          "donut": true,
          "innerRadius": 40
        }
    status_code: [200, 201]
  when: existing_charts.json.result | selectattr('slice_name', 'equalto', 'Check Results Pie') | list | length == 0

