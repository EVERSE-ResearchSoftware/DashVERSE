---
- name: Configure database connection
  include_tasks: database.yml

- name: Configure datasets
  include_tasks: datasets.yml

- name: Detect exported asset YAMLs
  find:
    paths: "{{ playbook_dir }}/../files/superset_assets"
    patterns: "*.yaml"
    recurse: yes
  register: superset_asset_files

- name: Import asset bundle when YAMLs are present
  include_tasks: import_assets.yml
  when: superset_asset_files.matched | int > 0

- name: Normalize chart params after import
  include_tasks: normalize_chart_params.yml
  when: superset_asset_files.matched | int > 0

- name: Configure charts (legacy path)
  include_tasks: charts.yml
  when: superset_asset_files.matched | int == 0

- name: Configure dashboards (legacy path)
  include_tasks: dashboards.yml
  when: superset_asset_files.matched | int == 0

- name: Configure permissions
  include_tasks: permissions.yml
