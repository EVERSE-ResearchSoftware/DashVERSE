# Generated by scripts/publish-ghcr.sh - do not edit.
#
# Participants need only this file:
#     docker compose -f docker-compose.ghcr.yml up -d
#
# Images are pulled from ghcr.io/everse-researchsoftware. The passwords below are workshop defaults;
# override any of them in a .env file next to this one if you care.

name: dashverse-workshop

# Ports match the Kubernetes port-forward map used in the main tutorial, so
# every URL on the slides and in the handout is the same on this path.

services:
  postgres:
    image: ghcr.io/everse-researchsoftware/dashverse-db:latest
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dashverse}
      POSTGRES_USER: ${POSTGRES_USER:-dashverse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dashverse}
      SUPERSET_READER_PASSWORD: ${SUPERSET_READER_PASSWORD:-dashverse}
    volumes:
      # postgres 18+ images keep the cluster in a major-version subdirectory,
      # so the volume mounts one level up from the classic /data path
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-dashverse} -d ${POSTGRES_DB:-dashverse}"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s
    restart: unless-stopped

  # One-shot. Waits for the backend to create auth.*, then applies the schema
  # files in order - the same sequence as the db-schema-apply Job on Kubernetes.
  schema-apply:
    image: ghcr.io/everse-researchsoftware/dashverse-db:latest
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-dashverse}
      POSTGRES_USER: ${POSTGRES_USER:-dashverse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dashverse}
      SUPERSET_READER_PASSWORD: ${SUPERSET_READER_PASSWORD:-dashverse}
    entrypoint: ["/bin/bash", "/schema/apply.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    restart: "no"

  postgrest:
    image: postgrest/postgrest:v16.2
    environment:
      PGRST_DB_URI: postgresql://${POSTGRES_USER:-dashverse}:${POSTGRES_PASSWORD:-dashverse}@postgres:5432/${POSTGRES_DB:-dashverse}
      PGRST_DB_SCHEMA: api
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_SERVER_PORT: "3000"
      PGRST_JWT_SECRET: ${JWT_SECRET:-workshop-jwt-secret-change-me-please-32chars}
      PGRST_JWT_ROLE_CLAIM_KEY: .role
      PGRST_OPENAPI_SERVER_PROXY_URI: http://localhost:3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      schema-apply:
        condition: service_completed_successfully
    restart: unless-stopped

  backend:
    image: ghcr.io/everse-researchsoftware/dashverse-backend:latest
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dashverse}:${POSTGRES_PASSWORD:-dashverse}@postgres:5432/${POSTGRES_DB:-dashverse}
      JWT_SECRET: ${JWT_SECRET:-workshop-jwt-secret-change-me-please-32chars}
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_DAYS: "7"
      PASSWORD_MIN_LENGTH: "8"
      MAX_LOGIN_ATTEMPTS: "5"
      LOCKOUT_DURATION_MINUTES: "15"
      LOG_LEVEL: INFO
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/openapi.json').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.10.1-alpine
    restart: unless-stopped

  superset:
    image: ghcr.io/everse-researchsoftware/dashverse-superset:latest
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-dashverse}
      DB_PASS: ${POSTGRES_PASSWORD:-dashverse}
      DB_NAME: ${POSTGRES_DB:-dashverse}
      SECRET_KEY: ${SUPERSET_SECRET_KEY:-workshop-superset-secret-change-me-32chars}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      PYTHONPATH: /app/pythonpath
    command: ["/bin/bash", "/app/bootstrap.sh", "webserver"]
    ports:
      - "127.0.0.1:8088:8088"
    depends_on:
      schema-apply:
        condition: service_completed_successfully
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8088/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 90s
    restart: unless-stopped

  frontend:
    image: ghcr.io/everse-researchsoftware/dashverse-frontend:latest
    environment:
      SUPERSET_URL: http://superset:8088
      SUPERSET_EXTERNAL_URL: http://localhost:8088
      SUPERSET_ADMIN_USER: admin
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
      POSTGREST_URL: http://postgrest:3000
      POSTGREST_EXTERNAL_URL: http://localhost:3000
      API_DOCS_EXTERNAL_URL: http://localhost:3001
      BACKEND_URL: http://backend:8000
      JWT_SECRET: ${JWT_SECRET:-workshop-jwt-secret-change-me-please-32chars}
      JWT_ALGORITHM: HS256
      LOG_LEVEL: INFO
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      backend:
        condition: service_started
      postgrest:
        condition: service_started
    restart: unless-stopped

  postgrest-docs:
    image: scalarapi/api-reference:latest
    environment:
      API_REFERENCE_CONFIG: '{"url":"http://localhost:3000/","theme":"purple"}'
    ports:
      - "127.0.0.1:3001:8080"
    restart: unless-stopped

  backend-docs:
    image: scalarapi/api-reference:latest
    environment:
      API_REFERENCE_CONFIG: '{"url":"http://localhost:8000/openapi.json","theme":"blue"}'
    ports:
      - "127.0.0.1:8001:8080"
    restart: unless-stopped

  # One-shot. Runs the project's own Ansible playbook against the Superset
  # above, so the datasets, charts and dashboards are the same ones the
  # Kubernetes deployment installs. Exits 0 when the import is done.
  provision:
    image: ghcr.io/everse-researchsoftware/dashverse-provision:latest
    environment:
      SUPERSET_URL: http://superset:8088
      SUPERSET_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
      DATABASE_HOST: postgres
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-dashverse}
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-dashverse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dashverse}
      POSTGRES_DB: ${POSTGRES_DB:-dashverse}
      SUPERSET_DB_USER: superset_reader
      SUPERSET_DB_PASSWORD: ${SUPERSET_READER_PASSWORD:-dashverse}
      INDICATORS_REF: ${INDICATORS_REF:-}
      SEED_DATA: ${SEED_DATA:-true}
    depends_on:
      superset:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
