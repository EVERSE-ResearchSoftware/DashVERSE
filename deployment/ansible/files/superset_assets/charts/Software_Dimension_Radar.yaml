slice_name: Dimension Profile
description: 'Outcome breakdown per quality dimension. With no software selected, this is

  the portfolio profile; pick a project in the filters to see its profile.

  100% stacked bars make it easy to compare dimensions -- the bigger the blue

  segment, the stronger the dimension; bigger orange means more failures.

  '
certified_by: null
certification_details: null
viz_type: echarts_timeseries_bar
params:
  x_axis: dimension_name
  groupby:
  - outcome
  metrics:
  - label: checks
    expressionType: SQL
    sqlExpression: COUNT(*)
  adhoc_filters:
  - clause: WHERE
    expressionType: SIMPLE
    subject: dimension_name
    operator: IS NOT NULL
    comparator: ''
  color_scheme: supersetColors
  label_colors:
    Pass: '#117733'
    Fail: '#CC3311'
    Not applicable: '#666666'
  orientation: horizontal
  stack: Stack
  contributionMode: row
  show_legend: true
  show_value: false
  rich_tooltip: true
  y_axis_format: .0%
  row_limit: 50
query_context: null
cache_timeout: null
