slice_name: Failed Checks Detail
description: Searchable table of failing checks with software, dimension, indicator, tool output, and the evidence the tool emitted.
certified_by: null
certification_details: null
viz_type: table
params:
  query_mode: raw
  all_columns:
  - software_name
  - dimension_name
  - indicator_name
  - tool_name
  - output_raw
  - evidence
  adhoc_filters:
  - clause: WHERE
    expressionType: SIMPLE
    subject: outcome
    operator: ==
    comparator: Fail
  row_limit: 200
  table_filter: true
  show_cell_bars: false
  page_length: 50
  column_config:
    output_raw:
      columnWidth: 220
    evidence:
      columnWidth: 400
    software_name:
      horizontalAlign: left
    dimension_name:
      horizontalAlign: left
    indicator_name:
      horizontalAlign: left
    tool_name:
      horizontalAlign: left
query_context: null
cache_timeout: null
