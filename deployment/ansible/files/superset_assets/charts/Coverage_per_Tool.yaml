slice_name: Coverage per Tool
description: Distinct indicators and quality dimensions each checking tool covers across all assessments.
certified_by: null
certification_details: null
viz_type: echarts_timeseries_bar
params:
  x_axis: tool_name
  metrics:
  - label: Indicators
    expressionType: SIMPLE
    column:
      column_name: indicator_id
    aggregate: COUNT_DISTINCT
  - label: Dimensions
    expressionType: SIMPLE
    column:
      column_name: dimension_id
    aggregate: COUNT_DISTINCT
  adhoc_filters:
  - clause: WHERE
    expressionType: SIMPLE
    subject: tool_name
    operator: IS NOT NULL
    comparator: ''
  color_scheme: supersetColors
  label_colors:
    Indicators: '#0072B2'
    Dimensions: '#009E73'
  orientation: horizontal
  show_legend: true
  rich_tooltip: true
  show_value: true
  stack: false
  y_axis_format: ',d'
  row_limit: 50
query_context: null
cache_timeout: null
