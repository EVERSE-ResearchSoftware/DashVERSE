slice_name: Tools Coverage
description: Which quality dimensions and indicators each tool checks. Sorted by
  tool name; filter the table to focus on one tool or one dimension.
certified_by: null
certification_details: null
viz_type: table
params:
  query_mode: raw
  all_columns:
  - tool
  - dimension_name
  - indicator_name
  - checks
  - passed
  - failed
  row_limit: 200
  table_filter: true
  show_cell_bars: true
  align_pn: true
  color_pn: false
  page_length: 25
  column_config:
    checks:
      d3NumberFormat: ',d'
      horizontalAlign: right
    passed:
      d3NumberFormat: ',d'
      horizontalAlign: right
    failed:
      d3NumberFormat: ',d'
      horizontalAlign: right
  conditional_formatting:
  - column: passed
    colorScheme: '#5fb56a'
    operator: '>'
    targetValue: 0
  - column: failed
    colorScheme: '#e35454'
    operator: '>'
    targetValue: 0
  order_by_cols:
  - '["tool", true]'
  - '["dimension_name", true]'
  - '["indicator_name", true]'
query_context: null
cache_timeout: null
