slice_name: Recent Assessments
description: Most recent assessments, one row per assessment, ordered by date.
certified_by: null
certification_details: null
viz_type: table
params:
  query_mode: aggregate
  groupby:
  - software_name
  - assessment_id
  - assessed_at
  metrics:
  - label: checks
    expressionType: SQL
    sqlExpression: COUNT(*)
  adhoc_filters:
