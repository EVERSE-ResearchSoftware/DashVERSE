      horizontalAlign: left
    assessment_id:
      horizontalAlign: right
    assessed_at:
      horizontalAlign: left
    checks:
      d3NumberFormat: ',d'
      horizontalAlign: right
  order_by_cols:
  - '["assessed_at", false]'
query_context: null
cache_timeout: null
