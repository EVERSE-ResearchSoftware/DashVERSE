slice_name: Catalog Coverage
description: How many of the EVERSE quality model's dimensions and indicators
  have actually been exercised. With no software selected this shows portfolio
  coverage; pick a project to see how complete its assessment is.
certified_by: null
certification_details: null
viz_type: table
params:
  query_mode: aggregate
  groupby:
  - category
  metrics:
  - label: Tested
    expressionType: SIMPLE
    column:
      column_name: item_id
    aggregate: COUNT_DISTINCT
  - label: Catalog
    expressionType: SIMPLE
    column:
      column_name: catalog_total
    aggregate: MAX
  - label: Coverage %
    expressionType: SQL
    sqlExpression: ROUND(100.0 * COUNT(DISTINCT item_id) / NULLIF(MAX(catalog_total), 0), 1)
  row_limit: 10
  table_filter: false
  show_cell_bars: true
  color_pn: false
query_context: null
cache_timeout: null
