slice_name: Catalog Coverage
description: How many of the EVERSE quality model's dimensions and indicators
  have actually been exercised. With no software selected this shows portfolio
  coverage; pick a project to see how complete its assessment is.
certified_by: null
certification_details: null
viz_type: echarts_timeseries_bar
params:
  x_axis: category
  metrics:
  - label: Tested
    expressionType: SIMPLE
    column:
      column_name: item_id
    aggregate: COUNT_DISTINCT
  - label: Catalog
    expressionType: SIMPLE
    column:
      column_name: catalog_total
    aggregate: MAX
  color_scheme: supersetColors
  label_colors:
    Tested: '#0072B2'
    Catalog: '#009E73'
  orientation: horizontal
  show_legend: true
  rich_tooltip: true
  y_axis_format: ',d'
  row_limit: 10
query_context: null
cache_timeout: null
