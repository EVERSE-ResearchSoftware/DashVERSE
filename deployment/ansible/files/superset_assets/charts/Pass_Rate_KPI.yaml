slice_name: Outcome Distribution
description: Share of all checks that returned pass, fail, or not applicable
  across every assessment. The donut shows where the portfolio currently stands
  on the categorical outcomes; bigger slices on the pass side mean broader
  catalog compliance.
certified_by: null
certification_details: null
viz_type: pie
params:
  groupby:
  - outcome
  metric:
    label: checks
    expressionType: SQL
    sqlExpression: COUNT(*)
  color_scheme: supersetColors
  label_colors:
    Pass: '#0072B2'
    Fail: '#D55E00'
    Not applicable: '#999999'
  show_labels: true
  show_labels_threshold: 5
  labels_outside: true
  show_legend: true
  donut: true
  innerRadius: 55
  outerRadius: 90
  label_type: key_percent
  number_format: .0%
query_context: null
cache_timeout: null
