slice_name: Improvement Targets
description: Failing indicators across the portfolio ranked by frequency, with links to the RSQKit topic and indicator definition.
certified_by: null
certification_details: null
viz_type: table
params:
  query_mode: aggregate
  groupby:
  - dimension_name
  - indicator_name
  - dimension_rsqkit_url
  - indicator_url
  metrics:
  - label: failures
    expressionType: SQL
    sqlExpression: COUNT(*)
  adhoc_filters:
  - clause: WHERE
    expressionType: SIMPLE
    subject: outcome
    operator: ==
    comparator: Fail
  - clause: WHERE
    expressionType: SIMPLE
    subject: indicator_name
    operator: IS NOT NULL
    comparator: ''
  row_limit: 50
  table_filter: true
  show_cell_bars: true
  align_pn: true
  color_pn: false
  page_length: 50
  column_config:
    failures:
      d3NumberFormat: ',d'
      horizontalAlign: right
    dimension_rsqkit_url:
      columnWidth: 240
    indicator_url:
      columnWidth: 240
    dimension_name:
      horizontalAlign: left
    indicator_name:
      horizontalAlign: left
  conditional_formatting:
  - column: failures
    colorScheme: '#D55E00'
    operator: '>'
    targetValue: 0
  order_by_cols:
  - '["failures", false]'
query_context: null
cache_timeout: null
