slice_name: Outcomes by Dimension
description: How each quality dimension's checks split across pass, fail, and
  not applicable. 100% stacked bars make it easy to compare dimensions where
  a high share of checks fails against ones that are mostly clean.
certified_by: null
certification_details: null
viz_type: echarts_timeseries_bar
params:
  x_axis: dimension_name
  groupby:
  - outcome
  metrics:
  - label: checks
    expressionType: SQL
    sqlExpression: COUNT(*)
  adhoc_filters:
  - clause: WHERE
    expressionType: SIMPLE
    subject: dimension_name
    operator: IS NOT NULL
    comparator: ''
  color_scheme: supersetColors
  label_colors:
    Pass: '#0072B2'
    Fail: '#D55E00'
    Not applicable: '#999999'
  orientation: horizontal
  stack: Stack
  contributionMode: row
  show_legend: true
  show_value: false
  rich_tooltip: true
  y_axis_format: .0%
  row_limit: 50
query_context: null
cache_timeout: null
