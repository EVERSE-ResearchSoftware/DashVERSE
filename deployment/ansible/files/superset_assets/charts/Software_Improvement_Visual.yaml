slice_name: Software Improvement Visual
description: Per-indicator score for the selected software. Filled bars are passing; thin bars need work.
certified_by: null
certification_details: null
viz_type: treemap_v2
params:
  groupby:
  - dimension_name
  - indicator_name
  metric:
    label: failures
    expressionType: SQL
    sqlExpression: COUNT(*)
  adhoc_filters:
  - clause: WHERE
    expressionType: SIMPLE
    subject: outcome
    operator: ==
    comparator: Fail
  - clause: WHERE
    expressionType: SIMPLE
    subject: software_name
    operator: IS NOT NULL
    comparator: ''
  - clause: WHERE
    expressionType: SIMPLE
    subject: dimension_name
    operator: IS NOT NULL
    comparator: ''
  color_scheme: supersetColors
  show_labels: true
  show_upper_labels: true
  label_type: key_value
  number_format: ',d'
  row_limit: 100
query_context: null
cache_timeout: null
