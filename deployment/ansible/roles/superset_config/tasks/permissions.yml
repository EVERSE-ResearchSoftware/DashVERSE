---

- name: Revoke list, write, and chrome permissions from Public role
  shell: |
    kubectl exec -n dashverse deploy/postgresql -- psql -U {{ database_user }} -d {{ database_db }} -c "
    DELETE FROM ab_permission_view_role
    WHERE role_id = (SELECT id FROM ab_role WHERE name = 'Public')
    AND permission_view_id IN (
        SELECT pv.id FROM ab_permission_view pv
        JOIN ab_permission p ON pv.permission_id = p.id
        JOIN ab_view_menu vm ON pv.view_menu_id = vm.id
        WHERE
          -- write / mutating operations. can_share_* and can_csv kept
          -- granted so the iframe's kabob menu still offers Download CSV
          -- and Copy permalink -- both expose only what the iframe is
          -- already showing the viewer.
          p.name IN (
            'can_add', 'can_delete', 'can_edit', 'can_write',
            'can_post', 'can_put', 'can_patch',
            'can_export', 'can_import',
            'can_bulk_create', 'can_delete_embedded',
            'can_set_embedded'
          )
          -- FAB UI list pages (the /chart/list/ etc. routes)
          OR p.name = 'can_list'
          -- menu items (don't suggest pages anon can't open)
          OR p.name = 'menu_access'
          -- explore / SQL lab / debug helpers we don't want anonymous
          OR (p.name = 'can_explore' AND vm.name = 'Superset')
          OR (p.name = 'can_view_query' AND vm.name = 'Dashboard')
          OR (p.name = 'can_estimate_query_cost' AND vm.name = 'SQLLab')
          OR (p.name = 'can_external_metadata' AND vm.name = 'Datasource')
          OR (p.name = 'can_external_metadata_by_name' AND vm.name = 'Datasource')
          OR (p.name = 'can_drill' AND vm.name = 'Dashboard')
          OR (p.name = 'can_userinfo' AND vm.name = 'UserDBModelView')
          OR vm.name IN (
            'SqlLab', 'SQL Lab',
            'SavedQuery', 'SavedQueryView', 'SavedQueryViewApi',
            'Query', 'QueryRestApi', 'Query Search',
            'Action Log', 'LogModelView', 'LogRestApi',
            'Alerts & Reports', 'AlertModelView',
            'ReportModelView', 'ReportScheduleRestApi'
          )
    );
    "
  register: public_strip_result

- name: Show Public-role strip result
  debug:
    var: public_strip_result.stdout_lines

- name: Grant Public role datasource_access on each embedded dataset
  shell: |
    kubectl exec -n dashverse deploy/postgresql -- psql -U {{ database_user }} -d {{ database_db }} -c "
    INSERT INTO ab_permission_view_role (id, permission_view_id, role_id)
    SELECT nextval('ab_permission_view_role_id_seq'), pv.id, r.id
    FROM ab_permission_view pv
    JOIN ab_permission p ON pv.permission_id = p.id
    JOIN ab_view_menu vm ON pv.view_menu_id = vm.id
    CROSS JOIN ab_role r
    WHERE p.name = 'datasource_access'
      AND r.name = 'Public'
      AND vm.name LIKE '%].[{{ item.table }}](id:%'
      AND NOT EXISTS (
        SELECT 1 FROM ab_permission_view_role
        WHERE permission_view_id = pv.id AND role_id = r.id
      );
    "
  loop: "{{ datasets }}"
  loop_control:
    label: "{{ item.table }}"
  register: dataset_grant_results

- name: Show dataset grant results
  debug:
    msg: "Granted Public access to {{ datasets | length }} embedded datasets"
